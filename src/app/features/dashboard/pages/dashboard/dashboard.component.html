<div class="space-y-6">

  <h2 class="text-xl font-semibold text-text-dark">
    Dashboard Overview
  </h2>

  <div class="grid grid-cols-4 gap-6">

    <app-stats-card
      title="Total Tasks"
      [value]="(stats$ | async)?.total || 0">
    </app-stats-card>

    <app-stats-card
      title="Completed"
      [value]="(stats$ | async)?.completed || 0">
    </app-stats-card>

    <app-stats-card
      title="Pending"
      [value]="(stats$ | async)?.pending || 0">
    </app-stats-card>

    <app-stats-card
      title="In Progress"
      [value]="(stats$ | async)?.inProgress || 0">
    </app-stats-card>

  </div>

</div>

<div class="min-h-screen flex items-center justify-center bg-bg">
  <div class="w-full max-w-md bg-white rounded-xl shadow-card p-8">
    <h1 class="text-2xl font-semibold text-text-dark mb-6">
      TaskFlow Login
    </h1>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      <div class="space-y-8">
        <app-input label="Correo" controlName="email" type="email">
        </app-input>
        <app-input label="Contraseña" controlName="password" type="password">
        </app-input>
      </div>
      <div *ngIf="error" class="text-sm text-red-500">
        {{ error }}
      </div>
      <div class="flex justify-center pt-2">
        <app-button>
          {{ loading ? 'Signing in...' : 'Login' }}
        </app-button>
      </div>
    </form>
  </div>
</div>

<header class="h-16 bg-white border-b border-border px-6 flex items-center justify-between">

  <h2 class="text-lg font-semibold text-text-dark">
    {{ title }}
  </h2>

  <div class="flex items-center gap-4">
    <input
      type="text"
      placeholder="Search..."
      class="px-3 py-2 rounded-lg border border-border bg-bg text-sm focus:outline-none focus:ring-2 focus:ring-primary"
    />

    <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-medium">
      {{ userName.charAt(0) }}
    </div>
  </div>

</header>

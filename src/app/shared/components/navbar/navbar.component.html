<header class="h-14 bg-white border-b border-border px-8 flex items-center justify-between">
  <div class="flex items-center gap-8 text-sm font-medium">
  </div>
  <div class="flex items-center gap-6">
    <div class="relative">
      <input #searchInput type="text" placeholder="Search" (input)="onSearch(searchInput.value)" class="w-56 pl-9 pr-4 py-1.5 rounded-lg border border-border bg-bg text-sm
         focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition" />
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-gray text-sm">
        🔍
      </span>
    </div>
    <button class="text-text-gray hover:text-text-dark transition">
      🔔
    </button>
    <button class="text-text-gray hover:text-text-dark transition">
      ⚙️
    </button>
  </div>
</header>
